<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가계부 - 2026.04.29</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: #fff;
      padding: 28px 24px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
    .summary {
      display: flex;
      justify-content: space-between;
      padding: 20px 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .summary-item { text-align: center; }
    .summary-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .summary-value { font-size: 20px; font-weight: 700; color: #1e293b; }
    .summary-value.total { color: #e74c3c; }
    .items { padding: 8px 0; }
    .item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.2s;
    }
    .item:hover { background: #f8fafc; }
    .item:last-child { border-bottom: none; }
    .item-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .icon-electronics { background: #ebf5ff; }
    .icon-food { background: #fff7ed; }
    .item-info { flex: 1; }
    .item-name { font-size: 15px; font-weight: 600; color: #1e293b; }
    .item-detail { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .item-right { text-align: right; }
    .item-price { font-size: 15px; font-weight: 700; color: #1e293b; }
    .item-category {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }
    .cat-electronics { background: #dbeafe; color: #1d4ed8; }
    .cat-food { background: #ffedd5; color: #c2410c; }
    .footer {
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-label { font-size: 14px; color: #64748b; font-weight: 500; }
    .footer-total { font-size: 22px; font-weight: 800; color: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Daily 가계부</h1>
      <p>2026년 04월 29일 (화)</p>
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">지출 건수</div>
        <div class="summary-value">2건</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">카테고리</div>
        <div class="summary-value">2개</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">총 지출</div>
        <div class="summary-value total">1,921,900원</div>
      </div>
    </div>

    <div class="items">
      <div class="item">
        <div class="item-icon icon-electronics">💻</div>
        <div class="item-info">
          <div class="item-name">맥북 에어 13" M5 (512GB)</div>
          <div class="item-detail">Apple 맥북 1대</div>
        </div>
        <div class="item-right">
          <div class="item-price">1,909,900원</div>
          <span class="item-category cat-electronics">전자기기</span>
        </div>
      </div>

      <div class="item">
        <div class="item-icon icon-food">🥛</div>
        <div class="item-info">
          <div class="item-name">바나나우유</div>
          <div class="item-detail">개당 1,200원 x 10개</div>
        </div>
        <div class="item-right">
          <div class="item-price">12,000원</div>
          <span class="item-category cat-food">식품</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-label">총 지출 합계</div>
      <div class="footer-total">1,921,900원</div>
    </div>
  </div>
</body>
</html>
