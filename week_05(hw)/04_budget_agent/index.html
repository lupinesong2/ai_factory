<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짠돌이 어드바이저</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Pretendard', sans-serif;
      background: #f5f5f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 헤더 */
    .header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      background: #fff3e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header-info p {
      font-size: 12px;
      color: #888;
    }

    /* 메인 영역 */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 사이드바 - 요약 */
    .sidebar {
      width: 260px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grand-total {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }

    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .cat-name {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .cat-amount {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .cat-count {
      font-size: 11px;
      color: #999;
    }

    /* 카테고리 색상 */
    .dot-식비 { background: #4caf50; }
    .dot-교통 { background: #1e88e5; }
    .dot-쇼핑 { background: #e53935; }
    .dot-문화 { background: #8e24aa; }
    .dot-의료 { background: #ef6c00; }
    .dot-주거 { background: #00897b; }
    .dot-통신 { background: #3949ab; }
    .dot-기타 { background: #757575; }

    /* 채팅 영역 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 720px;
      line-height: 1.6;
      font-size: 14px;
    }

    .msg-user {
      align-self: flex-end;
      background: #333;
      color: #fff;
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
    }

    .msg-bot {
      align-self: flex-start;
      background: #fff;
      padding: 16px 20px;
      border-radius: 4px 16px 16px 16px;
      border: 1px solid #e8e8e8;
    }

    .msg-bot h1, .msg-bot h2, .msg-bot h3 {
      margin-top: 12px;
      margin-bottom: 6px;
    }
    .msg-bot h1 { font-size: 18px; }
    .msg-bot h2 { font-size: 16px; }
    .msg-bot h3 { font-size: 14px; }
    .msg-bot p { margin-bottom: 8px; }
    .msg-bot ul, .msg-bot ol { margin-left: 20px; margin-bottom: 8px; }
    .msg-bot li { margin-bottom: 4px; }
    .msg-bot strong { font-weight: 700; }
    .msg-bot table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .msg-bot th, .msg-bot td { padding: 6px 10px; border: 1px solid #eee; text-align: left; }
    .msg-bot th { background: #f9f9f9; font-weight: 600; }
    .msg-bot hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    .msg-bot code { background: #f5f5f5; padding: 2px 5px; border-radius: 3px; font-size: 13px; }

    /* 환영 메시지 */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .welcome h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      margin-bottom: 24px;
    }

    .quick-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: #333;
      background: #333;
      color: #fff;
    }

    /* 로딩 */
    .msg-loading {
      align-self: flex-start;
      background: #fff;
      padding: 12px 20px;
      border-radius: 4px 16px 16px 16px;
      border: 1px solid #e8e8e8;
      font-size: 14px;
      color: #999;
    }

    .dot-anim::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* 입력 바 */
    .input-bar {
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }

    .input-bar input:focus {
      border-color: #333;
    }

    .input-bar button {
      padding: 10px 20px;
      border: none;
      border-radius: 24px;
      background: #333;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .input-bar button:hover { background: #555; }
    .input-bar button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">💰</div>
    <div class="header-info">
      <h1>짠돌이 어드바이저</h1>
      <p>당신의 지갑을 지키는 절약 전문가</p>
    </div>
  </div>

  <div class="main">
    <!-- 사이드바 -->
    <div class="sidebar">
      <h2>지출 현황</h2>
      <div class="grand-total" id="grand-total">-</div>
      <div id="cat-list"></div>
    </div>

    <!-- 채팅 -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon">💰</div>
          <h2>짠돌이 어드바이저</h2>
          <p>가계부 데이터를 기반으로 절약 조언을 드립니다.<br>아래 버튼을 누르거나 질문을 입력해보세요.</p>
          <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('전체 지출 분석해줘')">전체 분석</button>
            <button class="quick-btn" onclick="sendQuick('식비 분석해줘')">식비 분석</button>
            <button class="quick-btn" onclick="sendQuick('어디서 돈을 아낄 수 있을까?')">절약 포인트</button>
            <button class="quick-btn" onclick="sendQuick('짠돌이 점수 매겨줘')">짠돌이 점수</button>
          </div>
        </div>
      </div>

      <div class="input-bar">
        <input type="text" id="user-input" placeholder="가계부에 대해 질문해보세요..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">전송</button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let history = [];
    let welcomeVisible = true;

    // 사이드바 로드
    async function loadSidebar() {
      try {
        const res = await fetch('/api/summary');
        const data = await res.json();

        document.getElementById('grand-total').textContent =
          data.grandTotal.toLocaleString() + '원';

        document.getElementById('cat-list').innerHTML = data.summary.map(s => `
          <div class="cat-item">
            <div class="cat-name">
              <span class="cat-dot dot-${s.category}"></span>
              ${s.category}
              <span class="cat-count">${s.count}건</span>
            </div>
            <div class="cat-amount">${s.total.toLocaleString()}원</div>
          </div>
        `).join('');
      } catch (err) {
        console.error('사이드바 로드 오류:', err);
      }
    }

    // 마크다운 → HTML 변환 (간이)
    function md(text) {
      return text
        // 테이블
        .replace(/^\|(.+)\|$/gm, (match) => match)
        .replace(/((?:^\|.+\|$\n?)+)/gm, (table) => {
          const rows = table.trim().split('\n');
          if (rows.length < 2) return table;
          const parseRow = r => r.split('|').filter(c => c.trim() !== '').map(c => c.trim());
          const headers = parseRow(rows[0]);
          const sepIdx = rows[1].match(/^[\s|:-]+$/) ? 1 : -1;
          if (sepIdx === -1) return table;
          let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
          for (let i = 2; i < rows.length; i++) {
            const cols = parseRow(rows[i]);
            html += '<tr>' + cols.map(c => `<td>${c}</td>`).join('') + '</tr>';
          }
          return html + '</tbody></table>';
        })
        // 헤더
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // 수평선
        .replace(/^---$/gm, '<hr>')
        // 볼드
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // 리스트
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>')
        // 줄바꿈
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>')
        .replace(/^/, '<p>')
        .replace(/$/, '</p>')
        .replace(/<p><(h[1-3]|ul|table|hr)/g, '<$1')
        .replace(/<\/(h[1-3]|ul|table)><\/p>/g, '</$1>')
        .replace(/<hr><\/p>/g, '<hr>')
        .replace(/<p><\/p>/g, '');
    }

    // 메시지 추가
    function addMessage(role, content) {
      if (welcomeVisible) {
        messagesEl.innerHTML = '';
        welcomeVisible = false;
      }

      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg msg-user' : 'msg msg-bot';
      div.innerHTML = role === 'user' ? content : md(content);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showLoading() {
      if (welcomeVisible) {
        messagesEl.innerHTML = '';
        welcomeVisible = false;
      }
      const div = document.createElement('div');
      div.className = 'msg-loading';
      div.innerHTML = '<span class="dot-anim">분석 중</span>';
      div.id = 'loading';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideLoading() {
      const el = document.getElementById('loading');
      if (el) el.remove();
    }

    // 전송
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      addMessage('user', text);
      showLoading();
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history }),
        });
        const data = await res.json();

        hideLoading();

        if (data.error) {
          addMessage('bot', '오류가 발생했습니다: ' + data.error);
        } else {
          addMessage('bot', data.reply);
          history.push({ role: 'user', content: text });
          history.push({ role: 'assistant', content: data.reply });
          // 히스토리 최근 10개만 유지
          if (history.length > 20) history = history.slice(-20);
        }
      } catch (err) {
        hideLoading();
        addMessage('bot', '서버 연결에 실패했습니다.');
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    // 빠른 질문
    function sendQuick(text) {
      userInput.value = text;
      sendMessage();
    }

    // 엔터 키
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) sendMessage();
    });

    // 초기화
    loadSidebar();
    userInput.focus();
  </script>
</body>
</html>
