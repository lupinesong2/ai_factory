<style>
  * { font-family: 'Noto Sans KR', sans-serif; }

  @keyframes pokeball-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-30px) rotate(-10deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-15px) rotate(10deg); }
  }

  @keyframes pokeball-shake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-20deg); }
    40% { transform: rotate(20deg); }
    60% { transform: rotate(-10deg); }
    80% { transform: rotate(10deg); }
  }

  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideOutLeft {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-100%); opacity: 0; }
  }

  @keyframes fadeInUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @keyframes confetti-fall {
    0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(180deg); }
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    50% { box-shadow: 0 0 40px rgba(255,255,255,0.5); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes bar-fill {
    from { width: 0%; }
  }

  .animate-pokeball { animation: pokeball-bounce 2s ease-in-out infinite; }
  .animate-pokeball-shake { animation: pokeball-shake 0.5s ease-in-out; }
  .animate-slide-in { animation: slideInRight 0.5s ease-out forwards; }
  .animate-slide-out { animation: slideOutLeft 0.4s ease-in forwards; }
  .animate-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
  .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  .animate-float { animation: float 3s ease-in-out infinite; }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: confetti-fall linear forwards;
    z-index: 100;
    pointer-events: none;
  }

  .sparkle-star {
    position: absolute;
    animation: sparkle 1.5s ease-in-out infinite;
    pointer-events: none;
  }

  .pokemon-img {
    image-rendering: pixelated;
  }

  .bar-animate {
    animation: bar-fill 1s ease-out forwards;
  }

  .btn-choice {
    transition: all 0.2s ease;
  }
  .btn-choice:hover {
    transform: scale(1.03);
  }
  .btn-choice:active {
    transform: scale(0.97);
  }
</style>

// ========================================
// Scoring Logic
// ========================================
function calculateResult(scores) {
  const { courage, intelligence, social, emotion, energy, leadership } = scores;
  const total = courage + intelligence + social + emotion + energy + leadership;

  // Check for balanced (Eevee) - all traits within 3 points of each other
  const vals = [courage, intelligence, social, emotion, energy, leadership];
  const maxVal = Math.max(...vals);
  const minVal = Math.min(...vals);
  if (maxVal - minVal <= 3 && total > 0) {
    return POKEMON_RESULTS.find(p => p.id === 133); // Eevee
  }

  // Find top two traits
  const traitMap = { courage, intelligence, social, emotion, energy, leadership };
  const sorted = Object.entries(traitMap).sort((a, b) => b[1] - a[1]);
  const top1 = sorted[0][0];
  const top2 = sorted[1][0];

  // Snorlax: high emotion + lowest energy
  if (top1 === "emotion" && energy <= 2) {
    return POKEMON_RESULTS.find(p => p.id === 143);
  }

  // Alakazam: intelligence is dominant by far
  if (top1 === "intelligence" && sorted[0][1] - sorted[1][1] >= 4) {
    return POKEMON_RESULTS.find(p => p.id === 65);
  }

  // Match based on top two traits
  const matchKey = [top1, top2].sort().join("+");

  const traitToResult = {
    "energy+social": 25,         // Pikachu
    "emotion+intelligence": 1,   // Bulbasaur (first match)
    "courage+energy": 4,         // Charmander
    "emotion+social": 7,         // Squirtle
    "intelligence+leadership": 150, // Mewtwo
    "courage+leadership": 6,     // Charizard
    "courage+emotion": 149,      // Dragonite
  };

  let resultId = traitToResult[matchKey];

  // Secondary matches for overlapping combos
  if (!resultId) {
    if (top1 === "social" && top2 === "emotion" || top1 === "emotion" && top2 === "social") {
      resultId = emotion > social ? 39 : 7; // Jigglypuff vs Squirtle
    } else if (top1 === "emotion" && top2 === "intelligence" || top1 === "intelligence" && top2 === "emotion") {
      resultId = intelligence > emotion ? 131 : 1; // Lapras vs Bulbasaur
    } else if (top1 === "energy") {
      resultId = 25; // Pikachu fallback
    } else if (top1 === "courage") {
      resultId = 4; // Charmander fallback
    } else if (top1 === "intelligence") {
      resultId = 65; // Alakazam fallback
    } else if (top1 === "leadership") {
      resultId = 6; // Charizard fallback
    } else if (top1 === "social") {
      resultId = 25; // Pikachu fallback
    } else if (top1 === "emotion") {
      resultId = 39; // Jigglypuff fallback
    } else {
      resultId = 133; // Eevee ultimate fallback
    }
  }

  return POKEMON_RESULTS.find(p => p.id === resultId) || POKEMON_RESULTS[6];
}

// Design System Components
// ========================================
function Button({ children, onClick, variant = "primary", size = "md", disabled = false, className = "" }) {
  const baseClasses = "font-bold rounded-2xl transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-red-500 hover:bg-red-600 text-white shadow-lg hover:shadow-xl",
    secondary: "bg-white/20 hover:bg-white/30 text-white border-2 border-white/30",
    ghost: "bg-transparent hover:bg-white/10 text-white",
  };
  const sizes = {
    sm: "px-4 py-2 text-sm",
    md: "px-6 py-3 text-base",
    lg: "px-8 py-4 text-lg",
    xl: "px-10 py-5 text-xl",
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`${baseClasses} ${variants[variant]} ${sizes[size]} ${className}`}>
      {children}
    </button>
  );
}

function ProgressBar({ current, total }) {
  const pct = (current / total) * 100;
  return (
    <div className="w-full max-w-lg mx-auto">
      <div className="flex justify-between items-center mb-2">
        <span className="text-white/80 text-sm font-medium">질문 {current} / {total}</span>
        <span className="text-white/80 text-sm font-medium">{Math.round(pct)}%</span>
      </div>
      <div className="w-full h-3 bg-white/20 rounded-full overflow-hidden">
        <div className="h-full bg-gradient-to-r from-yellow-400 to-red-500 rounded-full transition-all duration-500 ease-out"
          style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

// ========================================
// Confetti Component
// ========================================
function Confetti() {
  const colors = ["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#FF6BD6", "#845EC2", "#FFC75F"];
  const pieces = useMemo(() => {
    return Array.from({ length: 60 }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      color: colors[Math.floor(Math.random() * colors.length)],
      delay: Math.random() * 3,
      duration: 2 + Math.random() * 3,
      size: 6 + Math.random() * 10,
      shape: Math.random() > 0.5 ? "50%" : "0%",
    }));
  }, []);

  return (
    <div className="fixed inset-0 pointer-events-none z-50">
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece"
          style={{
            left: `${p.left}%`,
            width: `${p.size}px`,
            height: `${p.size}px`,
            backgroundColor: p.color,
            borderRadius: p.shape,
            animationDelay: `${p.delay}s`,
            animationDuration: `${p.duration}s`,
          }} />
      ))}
    </div>
  );
}

// ========================================
// Radar Chart (SVG)
// ========================================
function RadarChart({ scores }) {
  const traits = [
    { key: "courage", label: "용기" },
    { key: "intelligence", label: "지능" },
    { key: "social", label: "사교성" },
    { key: "emotion", label: "감성" },
    { key: "energy", label: "에너지" },
    { key: "leadership", label: "리더십" },
  ];

  const cx = 150, cy = 150, maxR = 110;
  const maxScore = Math.max(...Object.values(scores), 1);

  function getPoint(index, value) {
    const angle = (Math.PI * 2 * index) / 6 - Math.PI / 2;
    const r = (value / (maxScore + 2)) * maxR;
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }

  const gridLevels = [0.25, 0.5, 0.75, 1.0];
  const dataPoints = traits.map((t, i) => getPoint(i, scores[t.key] || 0));
  const polygon = dataPoints.map(p => `${p.x},${p.y}`).join(" ");

  return (
    <svg viewBox="0 0 300 300" className="w-full max-w-[280px] mx-auto">
      {/* Grid */}
      {gridLevels.map((level, li) => {
        const pts = traits.map((_, i) => {
          const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
          const r = level * maxR;
          return `${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`;
        }).join(" ");
        return <polygon key={li} points={pts} fill="none" stroke="white" strokeOpacity="0.2" strokeWidth="1" />;
      })}
      {/* Axes */}
      {traits.map((_, i) => {
        const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
        const x2 = cx + maxR * Math.cos(angle);
        const y2 = cy + maxR * Math.sin(angle);
        return <line key={i} x1={cx} y1={cy} x2={x2} y2={y2} stroke="white" strokeOpacity="0.2" strokeWidth="1" />;
      })}
      {/* Data */}
      <polygon points={polygon} fill="rgba(255,220,100,0.3)" stroke="#FFD700" strokeWidth="2.5" />
      {dataPoints.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="5" fill="#FFD700" />
      ))}
      {/* Labels */}
      {traits.map((t, i) => {
        const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
        const r = maxR + 22;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        return (
          <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle"
            fill="white" fontSize="13" fontWeight="bold">
            {t.label}
          </text>
        );
      })}
    </svg>
  );
}

// ========================================
// Page: Question Screen
// ========================================
function QuestionScreen({ onComplete }) {
  const [currentQ, setCurrentQ] = useState(0);
  const [scores, setScores] = useState({
    courage: 0, intelligence: 0, social: 0, emotion: 0, energy: 0, leadership: 0,
  });
  const [animState, setAnimState] = useState("in"); // "in" | "out"
  const [selectedIdx, setSelectedIdx] = useState(null);

  const question = QUESTIONS[currentQ];

  const handleAnswer = useCallback((choice, idx) => {
    if (selectedIdx !== null) return;
    setSelectedIdx(idx);

    const newScores = { ...scores };
    Object.entries(choice.traits).forEach(([trait, val]) => {
      newScores[trait] = (newScores[trait] || 0) + val;
    });
    setScores(newScores);

    // Animate out then advance
    setTimeout(() => setAnimState("out"), 300);
    setTimeout(() => {
      if (currentQ + 1 < QUESTIONS.length) {
        setCurrentQ(currentQ + 1);
        setAnimState("in");
        setSelectedIdx(null);
      } else {
        onComplete(newScores);
      }
    }, 700);
  }, [currentQ, scores, selectedIdx, onComplete]);

  const choiceColors = [
    "from-red-400 to-pink-500",
    "from-blue-400 to-cyan-500",
    "from-green-400 to-emerald-500",
    "from-purple-400 to-indigo-500",
  ];

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 py-8 bg-gradient-to-br from-slate-800 via-slate-900 to-gray-900">
      <div className="w-full max-w-lg mb-8">
        <ProgressBar current={currentQ + 1} total={QUESTIONS.length} />
      </div>

      <div className={`w-full max-w-lg ${animState === "in" ? "animate-slide-in" : "animate-slide-out"}`}>
        <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border border-white/10">
          <div className="text-center mb-6">
            <span className="text-5xl mb-4 block">{question.emoji}</span>
            <h2 className="text-xl md:text-2xl font-bold text-white leading-relaxed">
              {question.question}
            </h2>
          </div>

          <div className="space-y-3">
            {question.choices.map((choice, i) => (
              <button key={i} onClick={() => handleAnswer(choice, i)}
                className={`btn-choice w-full text-left p-4 rounded-2xl font-medium text-white
                  bg-gradient-to-r ${choiceColors[i]}
                  ${selectedIdx === i ? "ring-4 ring-yellow-300 scale-[1.03]" : "opacity-90 hover:opacity-100"}
                  ${selectedIdx !== null && selectedIdx !== i ? "opacity-40" : ""}
                  shadow-md`}>
                <span className="text-white/70 font-bold mr-2">{String.fromCharCode(65 + i)}.</span>
                {choice.text}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ========================================
// Page: Result Screen
// ========================================
function ResultScreen({ scores, onRetry }) {

  const [revealed, setRevealed] = useState(false);
  const [copied, setCopied] = useState(false);

  const result = useMemo(() => calculateResult(scores), [scores]);

  useEffect(() => {
    const timer1 = setTimeout(() => setRevealed(true), 500);
    const timer2 = setTimeout(() => setShowConfetti(false), 5000);
    return () => { clearTimeout(timer1); clearTimeout(timer2); };
  }, []);

  const traitLabels = {
    courage: "용기", intelligence: "지능", social: "사교성",
    emotion: "감성", energy: "에너지", leadership: "리더십",
  };

    const text = `포켓몬 성격 테스트 결과!\n나와 닮은 포켓몬은 ${result.name} (${result.nameEn}) #${result.id}\n"${result.tagline}"\n\n나도 테스트 해보기!`;

      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${result.id}.gif`;

  return (
    <div className={`min-h-screen bg-gradient-to-br ${result.bgGradient} relative overflow-hidden`}>
      {showConfetti && <Confetti />}

      <div className="relative z-10 flex flex-col items-center px-4 py-8 md:py-12">
        {/* Header */}
        <div className={`text-center mb-6 ${revealed ? "animate-fade-up" : "opacity-0"}`}>
          <p className="text-white/80 text-sm font-medium mb-1 tracking-widest uppercase">당신과 닮은 포켓몬은...</p>
        </div>

        {/* Pokemon Image */}
        <div className={`relative mb-6 ${revealed ? "animate-fade-up" : "opacity-0"}`}
          style={{ animationDelay: "0.2s" }}>
          <Sparkles />
          <div className="animate-float">
            <img src={spriteUrl} alt={result.name}
              className="pokemon-img w-40 h-40 md:w-52 md:h-52 object-contain drop-shadow-2xl"
              onError={(e) => {
                e.target.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${result.id}.png`;
              }}
            />
          </div>
        </div>

        {/* Name & Tagline */}
        <div className={`text-center mb-8 ${revealed ? "animate-fade-up" : "opacity-0"}`}
          style={{ animationDelay: "0.4s" }}>
          <div className="inline-block bg-black/20 backdrop-blur-md rounded-full px-4 py-1 mb-3">
            <span className="text-white/80 text-sm font-medium">No.{String(result.id).padStart(3, "0")} | {result.type}</span>
          </div>
          <h1 className="text-4xl md:text-5xl font-black text-white mb-2 drop-shadow-lg">
            {result.name}
          </h1>
          <p className="text-white/80 text-lg font-medium mb-3">{result.nameEn}</p>
          <p className="text-white text-lg md:text-xl font-bold max-w-md mx-auto leading-relaxed">
            "{result.tagline}"
          </p>
        </div>

        {/* Main Card */}
        <div className={`w-full max-w-lg ${revealed ? "animate-fade-up" : "opacity-0"}`}
          style={{ animationDelay: "0.6s" }}>
          <div className="bg-black/20 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border border-white/10 mb-6">
            {/* Description */}
            <h3 className="text-white font-bold text-lg mb-3">성격 분석</h3>
            <p className="text-white/90 leading-relaxed mb-6 text-sm md:text-base">
              {result.description}
            </p>

            {/* Radar Chart */}
            <h3 className="text-white font-bold text-lg mb-3 text-center">성격 프로필</h3>
            <RadarChart scores={scores} />
          </div>

          {/* Trait Bars */}
          <div className={`bg-black/20 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border border-white/10 mb-6 ${revealed ? "animate-fade-up" : "opacity-0"}`}
            style={{ animationDelay: "0.8s" }}>
            <h3 className="text-white font-bold text-lg mb-4">특성 수치</h3>
            <div className="space-y-3">
              {sortedTraits.map(([key, val], i) => {
                const pct = maxScore > 0 ? Math.round((val / (maxScore + 2)) * 100) : 0;
                return (
                  <div key={key}>
                    <div className="flex justify-between mb-1">
                      <span className="text-white font-medium text-sm">{traitLabels[key]}</span>
                      <span className="text-white/70 text-sm">{val}점</span>
                    </div>
                    <div className="w-full h-3 bg-white/20 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-yellow-300 to-white rounded-full bar-animate"
                        style={{ width: `${pct}%`, animationDelay: `${0.8 + i * 0.1}s` }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Action Buttons */}
          <div className={`flex flex-col sm:flex-row gap-3 ${revealed ? "animate-fade-up" : "opacity-0"}`}
            style={{ animationDelay: "1s" }}>
            <Button onClick={handleShare} variant="secondary" size="lg" className="flex-1 text-center">
              {copied ? "복사 완료!" : "결과 공유하기"}
            </Button>
            <Button onClick={onRetry} variant="primary" size="lg" className="flex-1 text-center">
              다시 테스트하기
            </Button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ========================================
// App Component
// ========================================
function App() {
  const [screen, setScreen] = useState("intro"); // "intro" | "quiz" | "result"
  const [finalScores, setFinalScores] = useState(null);

  const handleStart = useCallback(() => setScreen("quiz"), []);

  const handleComplete = useCallback((scores) => {
    setFinalScores(scores);
    setScreen("result");
  }, []);

  const handleRetry = useCallback(() => {
    setFinalScores(null);
    setScreen("intro");
  }, []);

  if (screen === "intro") return <IntroScreen onStart={handleStart} />;
  if (screen === "quiz") return <QuestionScreen onComplete={handleComplete} />;
  if (screen === "result") return <ResultScreen scores={finalScores} onRetry={handleRetry} />;
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
