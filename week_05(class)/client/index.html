<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo · 미니멀 할 일 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-color: #fafafa;
  }
  /* hover 전용 노출 (모바일에서는 항상 보임) */
  .todo-row .delete-btn { opacity: 0; transition: opacity 150ms ease; }
  .todo-row:hover .delete-btn,
  .todo-row:focus-within .delete-btn { opacity: 1; }
  @media (hover: none) {
    .todo-row .delete-btn { opacity: 1; }
  }
  /* 커스텀 체크박스 애니메이션 */
  .check-circle {
    transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
  }
  .check-circle:hover { transform: scale(1.05); }
  /* 스크롤바 미니멀화 */
  .todo-list::-webkit-scrollbar { width: 6px; }
  .todo-list::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 3px; }
  .todo-list::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ========================================
// React Hooks
// ========================================
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ========================================
// 상수 / API
// ========================================
const API_BASE_URL = '/api';
const TOKEN_KEY = 'todo-app:token';
const USER_KEY  = 'todo-app:user';
const FILTERS = [
  { key: 'all',    label: '전체' },
  { key: 'active', label: '진행중' },
  { key: 'done',   label: '완료' },
];
const ACCENT = '#111827';

const ERROR_MESSAGES = {
  INVALID_EMAIL: '이메일 형식이 올바르지 않아요.',
  INVALID_NAME: '이름을 입력해 주세요.',
  PASSWORD_TOO_SHORT: '비밀번호는 8자 이상이어야 해요.',
  EMAIL_TAKEN: '이미 가입된 이메일이에요.',
  EMAIL_AND_PASSWORD_REQUIRED: '이메일과 비밀번호를 입력해 주세요.',
  INVALID_CREDENTIALS: '이메일 또는 비밀번호가 올바르지 않아요.',
  AUTH_REQUIRED: '로그인이 필요해요.',
  INVALID_TOKEN: '세션이 만료되었어요. 다시 로그인해 주세요.',
};

async function apiFetch(path, options = {}) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
  if (!res.ok) {
    let payload = null;
    try { payload = await res.json(); } catch {}
    const code = payload?.error;
    const err = new Error(ERROR_MESSAGES[code] || `오류가 발생했어요 (${res.status})`);
    err.status = res.status;
    err.code = code;
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

// 서버 row → 화면용 객체
const toView = (row) => ({
  id: row.id,
  text: row.title,
  done: row.is_completed,
  createdAt: row.created_at,
});

// ========================================
// Design System Components
// ========================================
function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {
  const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-neutral-400 disabled:opacity-40 disabled:cursor-not-allowed';
  const variants = {
    primary: 'bg-neutral-900 text-white hover:bg-neutral-800',
    secondary: 'bg-neutral-100 text-neutral-800 hover:bg-neutral-200',
    ghost: 'bg-transparent text-neutral-500 hover:text-neutral-900 hover:bg-neutral-100',
    danger: 'bg-transparent text-neutral-400 hover:text-red-500',
  };
  const sizes = {
    sm: 'text-xs px-2.5 py-1.5',
    md: 'text-sm px-4 py-2',
    lg: 'text-base px-5 py-3',
  };
  return (
    <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
      {children}
    </button>
  );
}

const Input = React.forwardRef(function Input({ className = '', ...props }, ref) {
  return (
    <input
      ref={ref}
      className={`w-full bg-transparent text-neutral-900 placeholder:text-neutral-400 focus:outline-none ${className}`}
      {...props}
    />
  );
});

function Card({ className = '', children }) {
  return (
    <div className={`bg-white rounded-2xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.06)] ${className}`}>
      {children}
    </div>
  );
}

function FilterTabs({ value, onChange }) {
  return (
    <div className="inline-flex items-center gap-1 p-1 bg-neutral-100 rounded-full">
      {FILTERS.map(f => {
        const active = value === f.key;
        return (
          <button
            key={f.key}
            onClick={() => onChange(f.key)}
            className={`px-3 py-1.5 text-xs sm:text-sm rounded-full transition-colors duration-150 ${
              active
                ? 'bg-white text-neutral-900 shadow-sm'
                : 'text-neutral-500 hover:text-neutral-800'
            }`}
            aria-pressed={active}
          >
            {f.label}
          </button>
        );
      })}
    </div>
  );
}

// ========================================
// Todo 전용 Subcomponents
// ========================================
function AddTodoForm({ onAdd }) {
  const [text, setText] = useState('');
  const inputRef = useRef(null);

  const submit = (e) => {
    e.preventDefault();
    const trimmed = text.trim();
    if (!trimmed) return;
    onAdd(trimmed);
    setText('');
    inputRef.current?.focus();
  };

  return (
    <form
      onSubmit={submit}
      className="flex items-center gap-2 px-4 sm:px-5 py-3 border-b border-neutral-100"
    >
      <span className="w-5 h-5 flex items-center justify-center text-neutral-300" aria-hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </span>
      <Input
        ref={inputRef}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="할 일을 입력하고 Enter"
        className="text-base sm:text-[15px] py-2"
        aria-label="새 할 일 입력"
        maxLength={200}
      />
      <Button
        type="submit"
        variant="primary"
        size="sm"
        disabled={!text.trim()}
        className="shrink-0"
      >
        추가
      </Button>
    </form>
  );
}

function TodoItem({ todo, onToggle, onDelete }) {
  return (
    <li
      className="todo-row group flex items-center gap-3 px-4 sm:px-5 py-3 border-b border-neutral-100 last:border-b-0"
    >
      <button
        type="button"
        onClick={() => onToggle(todo.id)}
        aria-label={todo.done ? '미완료로 표시' : '완료로 표시'}
        aria-pressed={todo.done}
        className={`check-circle shrink-0 w-5 h-5 rounded-full border flex items-center justify-center ${
          todo.done
            ? 'bg-neutral-900 border-neutral-900 text-white'
            : 'bg-white border-neutral-300 hover:border-neutral-500'
        }`}
      >
        {todo.done && (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-3 h-3">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        )}
      </button>

      <span
        className={`flex-1 text-[15px] leading-snug break-words ${
          todo.done ? 'line-through text-neutral-400' : 'text-neutral-800'
        }`}
        onClick={() => onToggle(todo.id)}
        role="button"
      >
        {todo.text}
      </span>

      <button
        type="button"
        onClick={() => onDelete(todo.id)}
        className="delete-btn shrink-0 text-neutral-300 hover:text-red-500 p-1 rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400"
        aria-label="삭제"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </li>
  );
}

function EmptyState({ filter }) {
  const messages = {
    all:    { title: '아직 할 일이 없어요', desc: '오늘의 첫 번째 할 일을 추가해 보세요.' },
    active: { title: '진행중인 할 일이 없어요', desc: '모두 완료했어요. 잠시 쉬어가도 좋아요.' },
    done:   { title: '완료한 항목이 없어요', desc: '하나씩 체크해 가며 완료해 보세요.' },
  };
  const m = messages[filter] || messages.all;
  return (
    <div className="flex flex-col items-center justify-center py-16 px-6 text-center">
      <div className="w-12 h-12 rounded-full bg-neutral-100 flex items-center justify-center mb-4 text-neutral-400">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" className="w-6 h-6">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </div>
      <p className="text-sm font-medium text-neutral-700">{m.title}</p>
      <p className="text-xs text-neutral-400 mt-1">{m.desc}</p>
    </div>
  );
}

// ========================================
// Page Component — TodoApp
// ========================================
function TodoApp({ user, onLogout }) {
  const [todos, setTodos] = useState([]);
  const [filter, setFilter] = useState('all');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const handleApiError = useCallback((e) => {
    if (e?.status === 401) {
      onLogout();
      return;
    }
    setError(e.message);
  }, [onLogout]);

  // 초기 로드
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const rows = await apiFetch('/todos');
        if (!cancelled) setTodos(rows.map(toView));
      } catch (e) {
        if (!cancelled) handleApiError(e);
        console.error(e);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [handleApiError]);

  const addTodo = useCallback(async (text) => {
    try {
      const row = await apiFetch('/todos', {
        method: 'POST',
        body: JSON.stringify({ title: text }),
      });
      setTodos((prev) => [toView(row), ...prev]);
    } catch (e) {
      handleApiError(e);
    }
  }, []);

  const toggleTodo = useCallback(async (id) => {
    const target = todos.find((t) => t.id === id);
    if (!target) return;
    const next = !target.done;
    setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: next } : t)));
    try {
      await apiFetch(`/todos/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ is_completed: next }),
      });
    } catch (e) {
      setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: !next } : t)));
      handleApiError(e);
    }
  }, [todos]);

  const deleteTodo = useCallback(async (id) => {
    const prev = todos;
    setTodos((cur) => cur.filter((t) => t.id !== id));
    try {
      await apiFetch(`/todos/${id}`, { method: 'DELETE' });
    } catch (e) {
      setTodos(prev);
      handleApiError(e);
    }
  }, [todos]);

  const clearCompleted = useCallback(async () => {
    const prev = todos;
    setTodos((cur) => cur.filter((t) => !t.done));
    try {
      await apiFetch('/todos', { method: 'DELETE' });
    } catch (e) {
      setTodos(prev);
      handleApiError(e);
    }
  }, [todos]);

  const filtered = useMemo(() => {
    if (filter === 'active') return todos.filter((t) => !t.done);
    if (filter === 'done')   return todos.filter((t) => t.done);
    return todos;
  }, [todos, filter]);

  const remaining = useMemo(() => todos.filter((t) => !t.done).length, [todos]);
  const completedCount = todos.length - remaining;

  return (
    <div className="min-h-screen w-full flex flex-col items-center px-4 py-10 sm:py-16">
      {/* Top bar */}
      <div className="w-full max-w-xl flex items-center justify-between mb-4 text-xs text-neutral-500">
        <span>
          <span className="text-neutral-400">로그인:</span>{' '}
          <span className="font-medium text-neutral-700">{user.name}</span>
        </span>
        <button
          type="button"
          onClick={onLogout}
          className="text-neutral-500 hover:text-neutral-900 hover:underline"
        >
          로그아웃
        </button>
      </div>

      {/* Header */}
      <header className="w-full max-w-xl mb-6 sm:mb-8 text-center">
        <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight text-neutral-900">
          오늘의 할 일
        </h1>
        <p className="text-sm text-neutral-400 mt-1.5">
          {user.name}님, 단순하게 한 줄씩 정리해 보세요.
        </p>
      </header>

      {/* Card */}
      <Card className="w-full max-w-xl overflow-hidden">
        <AddTodoForm onAdd={addTodo} />

        {/* Filters */}
        <div className="flex items-center justify-between gap-3 px-4 sm:px-5 py-3 border-b border-neutral-100">
          <FilterTabs value={filter} onChange={setFilter} />
          <span className="text-xs text-neutral-400 hidden sm:inline">
            총 {todos.length}개
          </span>
        </div>

        {/* List */}
        <div className="todo-list max-h-[55vh] overflow-y-auto">
          {loading ? (
            <div className="py-16 text-center text-sm text-neutral-400">불러오는 중…</div>
          ) : error ? (
            <div className="py-10 px-6 text-center">
              <p className="text-sm text-red-500">서버 통신 오류</p>
              <p className="text-xs text-neutral-400 mt-1 break-all">{error}</p>
            </div>
          ) : filtered.length === 0 ? (
            <EmptyState filter={filter} />
          ) : (
            <ul role="list">
              {filtered.map((t) => (
                <TodoItem
                  key={t.id}
                  todo={t}
                  onToggle={toggleTodo}
                  onDelete={deleteTodo}
                />
              ))}
            </ul>
          )}
        </div>

        {/* Footer */}
        <div className="flex items-center justify-between gap-3 px-4 sm:px-5 py-3 bg-neutral-50/60 border-t border-neutral-100">
          <span className="text-xs sm:text-sm text-neutral-500">
            남은 할 일 <span className="font-semibold text-neutral-800">{remaining}</span>개
          </span>
          <Button
            variant="ghost"
            size="sm"
            onClick={clearCompleted}
            disabled={completedCount === 0}
            aria-label="완료된 항목 모두 지우기"
          >
            완료 항목 지우기
            {completedCount > 0 && (
              <span className="ml-1 text-neutral-400">({completedCount})</span>
            )}
          </Button>
        </div>
      </Card>

      {/* Footnote */}
      <footer className="mt-6 text-[11px] text-neutral-400">
        Supabase PostgreSQL에 저장됩니다.
      </footer>
    </div>
  );
}

// ========================================
// Auth Screen (로그인 / 회원가입)
// ========================================
function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  const isSignup = mode === 'signup';

  const submit = async (e) => {
    e.preventDefault();
    setError(null);
    setSubmitting(true);
    try {
      const path = isSignup ? '/auth/signup' : '/auth/login';
      const body = isSignup ? { email, password, name } : { email, password };
      const { token, user } = await apiFetch(path, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, JSON.stringify(user));
      onAuthed(user);
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  };

  const switchMode = () => {
    setMode(isSignup ? 'login' : 'signup');
    setError(null);
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 py-10">
      <header className="w-full max-w-sm mb-6 text-center">
        <h1 className="text-2xl font-semibold tracking-tight text-neutral-900">
          {isSignup ? '회원가입' : '로그인'}
        </h1>
        <p className="text-sm text-neutral-400 mt-1.5">
          {isSignup ? '새 계정을 만들어 시작하세요.' : '오늘의 할 일을 정리해 보세요.'}
        </p>
      </header>

      <Card className="w-full max-w-sm p-6">
        <form onSubmit={submit} className="flex flex-col gap-4">
          {isSignup && (
            <label className="flex flex-col gap-1.5">
              <span className="text-xs text-neutral-500">이름</span>
              <Input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="홍길동"
                className="text-[15px] py-2 px-3 border border-neutral-200 rounded-lg focus:border-neutral-900"
                required
                maxLength={50}
                autoComplete="name"
              />
            </label>
          )}
          <label className="flex flex-col gap-1.5">
            <span className="text-xs text-neutral-500">이메일</span>
            <Input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="you@example.com"
              className="text-[15px] py-2 px-3 border border-neutral-200 rounded-lg focus:border-neutral-900"
              required
              autoComplete="email"
            />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-xs text-neutral-500">비밀번호</span>
            <Input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder={isSignup ? '8자 이상' : '비밀번호'}
              className="text-[15px] py-2 px-3 border border-neutral-200 rounded-lg focus:border-neutral-900"
              required
              minLength={isSignup ? 8 : 1}
              autoComplete={isSignup ? 'new-password' : 'current-password'}
            />
          </label>

          {error && (
            <div className="text-xs text-red-500 bg-red-50 border border-red-100 rounded-lg px-3 py-2">
              {error}
            </div>
          )}

          <Button
            type="submit"
            variant="primary"
            size="lg"
            disabled={submitting}
            className="w-full mt-1"
          >
            {submitting ? '처리 중…' : isSignup ? '가입하기' : '로그인'}
          </Button>
        </form>

        <div className="mt-5 pt-4 border-t border-neutral-100 text-center text-xs text-neutral-500">
          {isSignup ? '이미 계정이 있나요?' : '아직 계정이 없나요?'}
          <button
            type="button"
            onClick={switchMode}
            className="ml-1.5 font-medium text-neutral-900 hover:underline"
          >
            {isSignup ? '로그인' : '회원가입'}
          </button>
        </div>
      </Card>

      <p className="mt-6 text-[11px] text-neutral-400 text-center max-w-sm">
        테스트 계정: <span className="font-mono">alice@example.com</span> / <span className="font-mono">password123</span>
      </p>
    </div>
  );
}

// ========================================
// App Root (인증 게이트)
// ========================================
function App() {
  const [user, setUser] = useState(() => {
    try {
      const raw = localStorage.getItem(USER_KEY);
      const token = localStorage.getItem(TOKEN_KEY);
      if (!raw || !token) return null;
      return JSON.parse(raw);
    } catch { return null; }
  });

  const handleLogout = useCallback(() => {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    setUser(null);
  }, []);

  if (!user) {
    return <AuthScreen onAuthed={setUser} />;
  }
  return <TodoApp user={user} onLogout={handleLogout} />;
}

// ========================================
// Render
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
