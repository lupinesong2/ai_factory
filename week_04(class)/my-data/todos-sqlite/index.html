<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App (localStorage)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ========================================
    // 1. localStorage 헬퍼
    // ========================================
    const STORAGE_KEY = 'todos-app-data';

    const DEFAULT_TODOS = [
      { id: 1, text: '아침 운동하기', date: '2026-04-18', done: false, details: ['스트레칭 10분', '조깅 또는 걷기 30분', '간단한 근력 운동 15분'] },
      { id: 2, text: '코드 리뷰 및 프로젝트 정리', date: '2026-04-18', done: false, details: ['week_03 프로젝트 코드 리뷰', 'week_04 수업 자료 확인', 'Git 커밋 및 푸시'] },
      { id: 3, text: '독서 30분', date: '2026-04-18', done: false, details: ['기술 서적 또는 자기계발 도서 읽기', '인상 깊은 내용 메모하기'] },
      { id: 4, text: '장보기', date: '2026-04-18', done: false, details: ['과일 및 채소', '우유, 계란', '저녁 식사 재료'] },
      { id: 5, text: '이메일 및 메시지 정리', date: '2026-04-18', done: false, details: ['읽지 않은 이메일 확인 및 답장', '불필요한 메일 삭제', '중요한 일정 캘린더에 등록'] },
    ];

    function loadTodos() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : DEFAULT_TODOS;
    }

    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // ========================================
    // 2. App Component
    // ========================================
    function App() {
      const [todos, setTodos] = useState(loadTodos);
      const [text, setText] = useState('');
      const [expanded, setExpanded] = useState({});

      useEffect(() => {
        saveTodos(todos);
      }, [todos]);

      function handleAdd(e) {
        e.preventDefault();
        if (!text.trim()) return;
        const newTodo = {
          id: Date.now(),
          text: text.trim(),
          date: new Date().toISOString().slice(0, 10),
          done: false,
          details: [],
        };
        setTodos(prev => [...prev, newTodo]);
        setText('');
      }

      function handleToggle(id) {
        setTodos(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      }

      function handleDelete(id) {
        setTodos(prev => prev.filter(t => t.id !== id));
      }

      function toggleExpand(id) {
        setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
      }

      const doneCount = todos.filter(t => t.done).length;

      return (
        <div className="max-w-xl mx-auto px-4 py-10">
          <h1 className="text-3xl font-bold text-gray-800 mb-1">Todo List</h1>
          <p className="text-sm text-gray-400 mb-6">
            {todos.length}개 중 {doneCount}개 완료
          </p>

          {/* 입력 폼 */}
          <form onSubmit={handleAdd} className="flex gap-2 mb-8">
            <input
              type="text"
              value={text}
              onChange={e => setText(e.target.value)}
              placeholder="할 일을 입력하세요"
              className="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent text-sm"
            />
            <button
              type="submit"
              className="px-5 py-2.5 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition text-sm font-medium whitespace-nowrap"
            >
              추가
            </button>
          </form>

          {/* 할일 목록 */}
          <ul className="space-y-3">
            {todos.map(todo => (
              <li key={todo.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="flex items-center gap-3 px-4 py-3">
                  {/* 체크박스 */}
                  <button
                    onClick={() => handleToggle(todo.id)}
                    className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${
                      todo.done ? 'bg-blue-500 border-blue-500' : 'border-gray-300 hover:border-blue-400'
                    }`}
                  >
                    {todo.done && (
                      <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </button>

                  {/* 내용 */}
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm ${todo.done ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                      {todo.text}
                    </p>
                    {todo.date && <p className="text-xs text-gray-400 mt-0.5">{todo.date}</p>}
                  </div>

                  {/* 상세 토글 */}
                  {todo.details && todo.details.length > 0 && (
                    <button
                      onClick={() => toggleExpand(todo.id)}
                      className="text-gray-400 hover:text-gray-600 transition p-1"
                      title="상세 보기"
                    >
                      <svg
                        className={`w-4 h-4 transition-transform ${expanded[todo.id] ? 'rotate-180' : ''}`}
                        fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}
                      >
                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                      </svg>
                    </button>
                  )}

                  {/* 삭제 */}
                  <button
                    onClick={() => handleDelete(todo.id)}
                    className="text-gray-300 hover:text-red-500 transition p-1"
                    title="삭제"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                {/* 상세 내용 */}
                {expanded[todo.id] && todo.details && todo.details.length > 0 && (
                  <div className="px-4 pb-3 pt-0 ml-8">
                    <ul className="space-y-1">
                      {todo.details.map((detail, i) => (
                        <li key={i} className="text-xs text-gray-500 flex items-start gap-1.5">
                          <span className="text-gray-300 mt-0.5">-</span>
                          <span>{detail}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </li>
            ))}
          </ul>

          {todos.length === 0 && (
            <div className="text-center py-16">
              <p className="text-gray-400">할 일이 없습니다</p>
            </div>
          )}

          {/* 완료 항목 일괄 삭제 */}
          {doneCount > 0 && (
            <div className="mt-6 text-center">
              <button
                onClick={() => setTodos(prev => prev.filter(t => !t.done))}
                className="text-sm text-gray-400 hover:text-red-500 transition"
              >
                완료된 항목 삭제 ({doneCount})
              </button>
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 3. Rendering
    // ========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
