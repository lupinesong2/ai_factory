<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App (JSON)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .todo-done span { text-decoration: line-through; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const API = '/api/todos';

    function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '' }) {
      const base = 'rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer';
      const variants = {
        primary: 'bg-indigo-500 hover:bg-indigo-600 text-white focus:ring-indigo-400',
        danger: 'bg-red-400 hover:bg-red-500 text-white focus:ring-red-300',
        ghost: 'bg-transparent hover:bg-gray-100 text-gray-500 hover:text-gray-700 focus:ring-gray-300',
      };
      const sizes = {
        sm: 'px-2.5 py-1 text-sm',
        md: 'px-4 py-2 text-base',
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}>
          {children}
        </button>
      );
    }

    function Input({ value, onChange, onKeyDown, placeholder, inputRef, className = '' }) {
      return (
        <input
          ref={inputRef}
          type="text"
          value={value}
          onChange={onChange}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          className={`w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all duration-200 text-gray-700 placeholder-gray-400 ${className}`}
        />
      );
    }

    function TodoItem({ todo, onToggle, onDelete }) {
      const [expanded, setExpanded] = useState(false);
      const hasDetails = todo.details && todo.details.length > 0;

      return (
        <li className={`group bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 ${todo.done ? 'todo-done opacity-60' : ''}`}>
          <div className="flex items-center gap-3 px-4 py-3">
            <button
              onClick={() => onToggle(todo.id)}
              className={`flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200 cursor-pointer ${
                todo.done ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300 hover:border-indigo-400'
              }`}
              aria-label={todo.done ? '완료 취소' : '완료 처리'}
            >
              {todo.done && (
                <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              )}
            </button>

            <span
              className={`flex-1 text-base transition-colors duration-200 ${hasDetails ? 'cursor-pointer hover:text-indigo-500' : ''} ${todo.done ? 'text-gray-400' : 'text-gray-700'}`}
              onClick={() => hasDetails && setExpanded(!expanded)}
            >
              {todo.text}
              {hasDetails && (
                <svg className={`inline-block w-4 h-4 ml-1 text-gray-400 transition-transform duration-200 ${expanded ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              )}
            </span>

            <span className="text-xs text-gray-300 mr-1">{todo.date}</span>

            <button
              onClick={() => onDelete(todo.id)}
              className="opacity-0 group-hover:opacity-100 flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500 transition-all duration-200 cursor-pointer"
              aria-label="삭제"
            >
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          {expanded && hasDetails && (
            <ul className="px-14 pb-3 space-y-1">
              {todo.details.map((d, i) => (
                <li key={i} className="text-sm text-gray-500 flex items-start gap-2">
                  <span className="text-indigo-300 mt-0.5">&#8226;</span>
                  {d}
                </li>
              ))}
            </ul>
          )}
        </li>
      );
    }

    function App() {
      const [todos, setTodos] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(true);
      const inputRef = useRef(null);

      const fetchTodos = async () => {
        try {
          const res = await fetch(API);
          const json = await res.json();
          if (json.success) setTodos(json.data);
        } catch (e) {
          console.error('할일 로딩 실패:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTodos();
        inputRef.current?.focus();
      }, []);

      const addTodo = async () => {
        const text = input.trim();
        if (!text) return;
        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          const json = await res.json();
          if (json.success) setTodos(prev => [...prev, json.data]);
        } catch (e) {
          console.error('추가 실패:', e);
        }
        setInput('');
        inputRef.current?.focus();
      };

      const toggleTodo = async (id) => {
        try {
          const res = await fetch(`${API}/${id}`, { method: 'PATCH' });
          const json = await res.json();
          if (json.success) {
            setTodos(prev => prev.map(t => t.id === id ? json.data : t));
          }
        } catch (e) {
          console.error('상태 변경 실패:', e);
        }
      };

      const deleteTodo = async (id) => {
        try {
          const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) setTodos(prev => prev.filter(t => t.id !== id));
        } catch (e) {
          console.error('삭제 실패:', e);
        }
      };

      const doneCount = todos.filter(t => t.done).length;
      const totalCount = todos.length;

      return (
        <div className="min-h-screen flex items-start justify-center pt-12 sm:pt-20 px-4">
          <div className="w-full max-w-lg">
            <div className="text-center mb-8">
              <h1 className="text-3xl font-bold text-gray-800 mb-1">Todo (JSON)</h1>
              <p className="text-sm text-gray-400">
                {totalCount > 0 ? `${totalCount}개 중 ${doneCount}개 완료` : '할 일을 추가해 보세요'}
              </p>
            </div>

            <div className="flex gap-2 mb-6">
              <Input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addTodo()}
                placeholder="할 일을 입력하세요"
                inputRef={inputRef}
              />
              <Button onClick={addTodo} disabled={!input.trim()} className="flex-shrink-0">
                추가
              </Button>
            </div>

            {loading ? (
              <div className="text-center py-16 text-gray-400">
                <p className="text-sm">불러오는 중...</p>
              </div>
            ) : totalCount === 0 ? (
              <div className="text-center py-16 text-gray-300">
                <svg className="w-16 h-16 mx-auto mb-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <p className="text-sm">아직 할 일이 없습니다</p>
              </div>
            ) : (
              <ul className="space-y-2">
                {todos.map(todo => (
                  <TodoItem key={todo.id} todo={todo} onToggle={toggleTodo} onDelete={deleteTodo} />
                ))}
              </ul>
            )}

            {doneCount > 0 && (
              <div className="mt-6 text-center">
                <Button
                  variant="ghost"
                  size="sm"
                  onClick={async () => {
                    const doneTodos = todos.filter(t => t.done);
                    await Promise.all(doneTodos.map(t => fetch(`${API}/${t.id}`, { method: 'DELETE' })));
                    setTodos(prev => prev.filter(t => !t.done));
                  }}
                >
                  완료된 항목 삭제 ({doneCount})
                </Button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
